<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login Comercial</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#f27618;--or-d:#e4640f;--ink:#111526;--mut:#9aa0aa;--bd:#e6e8ee;--dg:#dc3545;--rose:#e4607d;--blush:#f9d9df;--wine:#2e1028;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
html,body{width:100%;min-width:320px;min-height:100%;margin:0;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);background:#fff;overflow:hidden}
body{display:flex;align-items:stretch;min-height:100svh}
button,input{font:inherit}
.left{position:relative;flex:0 0 60%;min-height:100svh;overflow:hidden;background:linear-gradient(135deg,#2a2f45,#0d0f18 70%);display:flex;align-items:center;justify-content:center;padding:clamp(24px,4vw,56px);text-align:center}
.left:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.66)}
.hero{position:relative;width:min(610px,84%);color:#fff}
.brand{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(40px,4.4vw,64px);letter-spacing:-.04em;margin-bottom:23px}.brand b{color:var(--or)}
.hero h1{margin:0 0 20px;font-family:'Outfit',sans-serif;font-size:clamp(31px,3.1vw,48px);font-weight:800;line-height:1.05;letter-spacing:-.055em}
.hero p{margin:0 auto;max-width:520px;font-size:clamp(14px,1.1vw,17px);font-weight:600;line-height:1.55;color:rgba(255,255,255,.84)}
.right{flex:0 0 40%;min-height:100svh;display:flex;align-items:center;justify-content:center;background:#fff;border-top:4px solid var(--or);padding:clamp(28px,4vw,54px)}
form{width:100%;max-width:330px}
.mob{display:none;font-family:'Outfit',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.04em;margin-bottom:26px}.mob b{color:var(--or)}
h2{margin:0 0 8px;font-family:'Outfit',sans-serif;font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.035em}
.bar{display:block;width:38px;height:3px;margin-bottom:18px;border-radius:999px;background:var(--or)}
.sub{margin:0 0 28px;font-size:12.5px;font-weight:500;line-height:1.5;color:var(--mut)}
.g{margin-bottom:26px}
label{display:block;margin-bottom:10px;font-size:11px;font-weight:800;letter-spacing:.095em;text-transform:uppercase;color:var(--or-d)}
input{width:100%;height:36px;padding:0 0 10px;border:0;border-bottom:1px solid var(--bd);border-radius:0;outline:0;background:transparent;color:#2b2f3d;font-size:14px;font-weight:500;transition:border-color .18s,box-shadow .18s}
input::placeholder{color:#aeb3bd;opacity:1}
input:focus{border-bottom-color:var(--or);box-shadow:0 1px 0 0 var(--or)}
.err{color:var(--dg);font-size:13px;font-weight:500;margin:-14px 0 14px}
.btn{width:100%;min-height:42px;padding:11px 14px;border:0;border-radius:8px;background:var(--or);color:#fff;box-shadow:0 13px 26px rgba(242,118,24,.24);font-size:13px;font-weight:800;cursor:pointer;transition:background-color .18s,box-shadow .18s,transform .16s}
.btn:hover{background:var(--or-d);transform:translateY(-1px)}.btn:active{transform:none}.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foot{margin:22px 0 0;text-align:center;color:#a0a5ae;font-size:12px;font-weight:500}.foot a{color:var(--or-d);font-weight:800;text-decoration:none}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(max-width:992px){.left{display:none}.right{flex:1 1 100%}.mob{display:block}}
.ok{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;
background:radial-gradient(120% 90% at 50% 20%,#4a1a3f,var(--wine) 70%);opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s linear .7s}
.ok.show{opacity:1;visibility:visible;transition-delay:0s}
.ok h1{margin:0;font-family:var(--h);font-weight:800;font-size:clamp(54px,16vw,104px);line-height:1;color:var(--blush);text-shadow:0 0 28px rgba(228,96,125,.55)}
.ok h1 span{display:inline-block;opacity:0;transform:translateY(18px) scale(.8);filter:blur(6px)}
.show h1 span{animation:l .7s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*.09s + .3s)}
@keyframes l{to{opacity:1;transform:none;filter:none}}
figure{margin:0;background:#fff7ef;padding:10px 10px 14px;border-radius:6px;transform:rotate(-2.5deg) scale(.85);opacity:0;box-shadow:0 20px 44px rgba(0,0,0,.5)}
figure img{display:block;width:min(68vw,300px);height:auto;border-radius:3px}
.show figure{animation:p .9s cubic-bezier(.2,.9,.3,1.1) 1.3s forwards}
@keyframes p{to{opacity:1;transform:rotate(-2.5deg) scale(1)}}
.again{font:inherit;font-size:14px;color:var(--blush);background:none;border:0;border-bottom:1px solid rgba(249,217,223,.4);cursor:pointer;opacity:0;padding:2px 4px}
.show .again{animation:f .6s ease 2.4s forwards}@keyframes f{to{opacity:.85}}
.heart{position:fixed;bottom:-40px;z-index:20;pointer-events:none;color:var(--rose);opacity:0;animation:r var(--d) ease-out forwards}
@keyframes r{10%{opacity:.9}100%{transform:translate(var(--x),-108vh) rotate(var(--q));opacity:0}}
@media(max-width:760px){body{flex-direction:column}.left{flex:none;padding:28px 24px}.left h1{font-size:28px;margin:8px 0}.left p{font-size:14px}}
@media(prefers-reduced-motion:reduce){.heart{display:none}.shake{animation:none}}
</style></head><body>
<section class="left"><div class="hero"><div class="brand">Sig<b>One</b> Comercial</div>
<h1>Suite de Gestión Comercial</h1><p>CRM, Ventas &amp; Costos y Almacenes en una sola plataforma</p></div></section>
<section class="right"><form id="f" novalidate>
<div class="mob">Sig<b>One</b> Comercial</div>
<h2>Bienvenido</h2><span class="bar"></span><p class="sub">Ingresa tus credenciales para continuar</p>
<div class="g"><label for="e">Correo electrónico</label><input id="e" type="email" placeholder="usuario@sigcomt.com" autocomplete="username"></div>
<div class="g"><label for="p">Contraseña</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password"></div>
<div class="err" id="err" hidden></div>
<button class="btn" type="submit">Ingresar al Sistema</button>
<p class="foot">¿Problemas para acceder? <a href="#" onclick="return false">Contacta soporte</a></p>
</form></section>

<script>
// Cambia aquí las credenciales que le vas a compartir.
var USER="admin@sigcomt.com", PASS="admin";
var f=document.getElementById('f'),e=document.getElementById('e'),p=document.getElementById('p'),err=document.getElementById('err'),ok=document.getElementById('ok');
document.getElementById('m').innerHTML='Te quiero'.split('').map(function(c,i){return '<span aria-hidden="true" style="--i:'+i+'">'+(c===' '?'&nbsp;':c)+'</span>'}).join('');
function hearts(n){for(var i=0;i<n;i++){var h=document.createElement('span');h.className='heart';h.textContent='♥';

h.style.setProperty('--d',3+Math.random()*3+'s');h.style.animationDelay=Math.random()*1.2+'s';
document.body.appendChild(h);setTimeout(function(x){x.remove()},8000,h)}}
f.addEventListener('submit',function(ev){ev.preventDefault();
if(!e.value.trim()||!p.value){err.textContent='Ingresa tu correo y contraseña.';err.hidden=false;return}
